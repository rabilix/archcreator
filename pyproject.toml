[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "archcreator"
version = "0.1.0"
description = "Deterministic architecture review for embedded C (MVP: single-module analysis)"
requires-python = ">=3.11"
dependencies = [
    "libclang==18.1.1",
    "PyYAML==6.0.2",
    "lizard==1.17.13",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]
build = ["pyinstaller==6.16.0"]
docs = ["markdown==3.7"]

[project.scripts]
archcreator = "archcreator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
