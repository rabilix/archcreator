    - ../../bmw_bac_sip/ThirdParty/BAC25/Supply/core/SnapS/classic/include
    - ../../bmw_bac_sip/ThirdParty/BAC25/Supply/core/Darh/generic/include
    - ../../bmw_bac_sip/ThirdParty/BAC25/Supply/core/Darh/classic/include
    - ../../bmw_bac_sip/ThirdParty/BAC25/Supply/core/Rmh/classic/include
    - ../../bmw_bac_sip/ThirdParty/BAC25/Supply/core/Adt/generic/include
    - ../../bmw_bac_sip/ThirdParty/BAC25/Supply/core/Adt/classic/include
    - ../../bmw_bac_sip/ThirdParty/BAC25/Supply/core/Vin/classic/include

build_list:
  makefile: software/source/100554.mak
  variables: [CSRC_FLEX, CSRC_BSW, ASRC]
  base_dir: software/source
  # make adds the directory of every compiled source to the include path (SPATH)
  add_source_dirs_to_includes: true

# Signal pool: generated accessor macros in signals.h; a use is a read/write of the signal, not of signals.h.
signal_pool:
  header: software/source/flex/system/signals.h
  accessors:
    - {macro: "SP_Set_{signal}_Errorflag", access: error_write}
    - {macro: "SP_Test_{signal}_Errorflag", access: error_read}
    - {macro: "SP_Get_{signal}", access: read}
    - {macro: "SP_Set_{signal}", access: write}
    - {macro: "SP_SetDefault_{signal}", access: write}
    - {macro: "SP_Test_{signal}", access: test}

# Design model (Enterprise Architect .qea at the repository root, read-only). The component root tells the
# App components apart from same-named SCU/FBL components.
design:
  model: 100554_BMW_DCDC_GEN3.qea
  component_root: DCDC_Shared_Model/Component/MCU/Flex/APPL
  signal_packages: [Signals]

modules:
  # Proposed from code (INFERENCE); confirm or correct.
  prefix_aliases:
    DCDC_Safety_Functions: [DCDC_SF_]
    Error_Check: [EC_]
  # Exported symbols called from outside the App folder (RTE runnables, BSW callbacks): not dead exports.
  # Proposed from code (INFERENCE); confirm or correct.
  export_exempt: ["*_Init", "*_Main", "*_Main_*", "BswM_Cbk_*", "*_DiagnosticEventTrigger_*"]

# Layers (scan, LAYER-001): not configured. A proposal to confirm, based on the folder structure:
# layers:
#   assign:
#     swc: ["software/source/flex/appl/swc/*"]
#     appl: ["software/source/flex/appl/*.c", "software/source/flex/appl/*.h"]
#     driver: ["software/source/flex/driver/*"]
#     system: ["software/source/flex/system/*"]
#   allow:
#     swc: [system]
#     appl: [swc, driver, system]

rules:
  # Proposed thresholds, to be calibrated on measured distributions.
  complexity: {ccn_max: 15, nesting_max: 5, nloc_max: 150, params_max: 6}

gate:
  min_parse_coverage: 0.95
