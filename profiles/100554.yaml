    - ../../bmw_bac_sip/Components/E2EXf/Implementation
    - ../../bmw_bac_sip/Components/EcuM/Implementation
    - ../../bmw_bac_sip/Components/IpduM/Implementation
    - ../../bmw_bac_sip/Components/KeyM/Implementation
    - ../../bmw_bac_sip/Components/Mcal_Spc58xxy/Implementation
    - ../../bmw_bac_sip/Components/Nm/Implementation
    - ../../bmw_bac_sip/Components/PduR/Implementation
    - ../../bmw_bac_sip/Components/SecOC/Implementation
    - ../../bmw_bac_sip/Components/StbM/Implementation
    - ../../bmw_bac_sip/Components/vDem42/Implementation
    - ../../bmw_bac_sip/Components/vMem_30_Mpc574xg/Implementation
    - ../../bmw_bac_sip/Components/vMemAccM/Implementation
