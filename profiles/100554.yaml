# Target profile: BMW PCU48 (100554_mc_appl), reference variant = Release (Release_Build.bat).
# Sources of truth:
#   include_dirs  = union of software/source/100554_settings.lnt (-I) and 100554.mak (INCPATH);
#                   dirs listed there but absent on disk are omitted (os, Dbg, DcmFbl, Dlt, Lin*, Rtm, vItaHlp)
#   defines       = Diab compatibility shim from 100554_settings.lnt + Release defines from 100554.mak
#   build_list    = CSRC_FLEX + CSRC_BSW + ASRC in 100554.mak
profile_version: 1
name: "100554-release"
# Repositories this central profile applies to (archcreator picks it when --profile is not given).
match:
  git_remotes: ["git@bitbucket.org:bitbucket-flex/100554_mc_appl.git"]
  repo_names: ["100554_mc_appl"]
# Folders whose .c files are modules; /flex is the start, delivered applications are added here as further entries.
scope:
  - software/source/flex
# Accepted findings (human decisions); empty until the first review round. Draft: archcreator baseline-draft.
baseline: 100554.baseline.yaml

compile:
  working_dir: software/source
  args:
    - "-std=gnu11"
    - "--target=powerpc-unknown-eabi"
    - "-ferror-limit=0"
    # Diab compatibility shim, part 2 (needed by flex/system and flex/global, not by flex/appl):
    # X-macro tables (MemIf.c) nest deeper than clang's default of 256 brackets.
    - "-fbracket-depth=4096"
    # Diab accepts a call before any declaration (main.c calls SP_Init without signalpool.h); clang makes it an error.
    - "-Wno-error=implicit-function-declaration"
  defines:
    # Diab compatibility shim (mirrors 100554_settings.lnt)
    - "__inline__="
    - "__ppc"
    - "__interrupt__="
    - "__attribute__(v)="
    # utils.c declares the byte-swap builtins as ordinary functions for analysis tools; clang refuses a
    # conflicting redeclaration of a builtin, so they get plain names here.
    - "__builtin_bswap16=diab_builtin_bswap16"
    - "__builtin_bswap32=diab_builtin_bswap32"
    # Release build defines (100554.mak, SW_FULL_ACCESS_MODE=1, DEBUG unset)
    - "SW_FULL_ACCESS_MODE"
    - "BRS_COMP_DIABDATA"
  system_include_dirs:
    # Machine-specific: Wind River Diab 5.9.9.0 installation
    - "F:/Programme/WindRiver_5_9/diab/5.9.9.0/include"
    - "F:/Programme/WindRiver_5_9/diab/5.9.9.0/include/diab"
    - "F:/Programme/WindRiver_5_9/diab/5.9.9.0/include/dinkum/c"
  include_dirs:
    - bsw
    - bsw/BAC
    - flex/appl
    - flex/appl/swc
    - flex/driver
    - flex/global
    - flex/system
    - flex/dcdc_pcu48
    - generated
    - generated/simulink
    - generated/Components
    - ../../bmw_bac_sip/Components/_Common/Implementation
    - ../../bmw_bac_sip/Components/Com/Implementation
    - ../../bmw_bac_sip/Components/Crc/Implementation
    - ../../bmw_bac_sip/Components/Dem/Implementation
    - ../../bmw_bac_sip/Components/Det/Implementation
    - ../../bmw_bac_sip/Components/E2E/Implementation
    - ../../bmw_bac_sip/Components/Os/Implementation
    - ../../bmw_bac_sip/Components/vSecPrim/Implementation
    - ../../bmw_bac_sip/Components/BswM/Implementation
    - ../../bmw_bac_sip/Components/Can_30_Mcan/Implementation
    - ../../bmw_bac_sip/Components/CanIf/Implementation
    - ../../bmw_bac_sip/Components/CanNm/Implementation
    - ../../bmw_bac_sip/Components/CanSM/Implementation
    - ../../bmw_bac_sip/Components/CanTp/Implementation
    - ../../bmw_bac_sip/Components/CanTrcv_30_Generic/Implementation
    - ../../bmw_bac_sip/Components/CanTSyn/Implementation
    - ../../bmw_bac_sip/Components/CanXcp/Implementation
    - ../../bmw_bac_sip/Components/ComM/Implementation
    - ../../bmw_bac_sip/Components/CryIf/Implementation
    - ../../bmw_bac_sip/Components/Crypto_30_LibCv/Implementation
